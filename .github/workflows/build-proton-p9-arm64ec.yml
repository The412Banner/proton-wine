name: Build Proton 9 arm64ec (SDK 28)

# Full arm64ec Proton 9 build -> installable Bannerlator/GameNative .wcp.
# Artifact-only: there is NO release/publish job here on purpose.
# Reuses this branch's own build-scripts/build-step-arm64ec.sh phases
# (--build-sysvshm / --configure / --build / --install), which target the
# pipetto-crypto Wine-9 arm64ec tree and its flat android/patches layout.

on:
  push:
    branches: [ feat/p9-fexunixlib, feat/p9-arihany-parity ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [aarch64]
      fail-fast: false

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up build environment
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            curl \
            unzip \
            flex \
            bison \
            gettext \
            autoconf \
            automake \
            libtool \
            pkg-config \
            mingw-w64 \
            gcc-multilib \
            g++-multilib \
            libfreetype6-dev \
            libfreetype6-dev:i386 \
            libpng-dev \
            libpng-dev:i386 \
            zlib1g-dev \
            zlib1g-dev:i386

      - name: Download and extract termuxfs for ${{ matrix.arch }}
        run: |
          mkdir -p $HOME/termuxfs/${{ matrix.arch }}
          cd $HOME/termuxfs/${{ matrix.arch }}
          wget https://github.com/GameNative/termux-on-gha/releases/download/build-20260218/termuxfs-${{ matrix.arch }}.tar
          tar -xf termuxfs-${{ matrix.arch }}.tar
          ls -la $HOME/termuxfs/${{ matrix.arch }}/

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ~/Android/Sdk/ndk/27.3.13750724
          key: android-ndk-r27d

      - name: Set up Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/Android/Sdk/ndk
          cd $HOME/Android/Sdk/ndk
          wget https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip
          mv android-ndk-r27d 27.3.13750724

      - name: Cache LLVM MinGW toolchain
        id: cache-llvm-mingw
        uses: actions/cache@v4
        with:
          path: ~/toolchains/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64
          key: bylaws-llvm-mingw-20250920

      - name: Set up LLVM MinGW toolchain
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          wget https://github.com/bylaws/llvm-mingw/releases/download/20250920/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar -xf llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz

      - name: Run autogen.sh
        run: |
          bash autogen.sh

      - name: Cache wine-tools
        id: cache-wine-tools
        uses: actions/cache@v4
        with:
          path: wine-tools
          key: wine-tools-${{ hashFiles('configure.ac', 'configure') }}

      - name: Build wine-tools (step 0)
        if: steps.cache-wine-tools.outputs.cache-hit != 'true'
        run: |
          bash build-scripts/build-step0.sh

      - name: Build sysvshm library
        run: |
          bash build-scripts/build-step-arm64ec.sh --build-sysvshm

      - name: Configure build (applies android/patches)
        run: |
          bash build-scripts/build-step-arm64ec.sh --configure

      - name: Build Proton 9 arm64ec (full make)
        run: |
          set -eo pipefail
          bash build-scripts/build-step-arm64ec.sh --build

      - name: Install Proton 9 arm64ec
        run: |
          set -eo pipefail
          bash build-scripts/build-step-arm64ec.sh --install

      - name: Assert critical guest programs are present
        run: |
          set -eo pipefail
          GUEST_DIR="$HOME/compiled-files-aarch64/lib/wine/aarch64-windows"
          echo "Checking guest programs in: $GUEST_DIR"
          missing=0
          for exe in wineboot.exe start.exe explorer.exe services.exe; do
            if [ ! -f "$GUEST_DIR/$exe" ]; then
              echo "ERROR: missing critical guest program: $exe" >&2
              missing=1
            else
              echo "  found: $exe"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "ERROR: install tree is incomplete (see missing programs above)." >&2
            echo "Refusing to package an unbootable .wcp." >&2
            ls -la "$GUEST_DIR" || true
            exit 1
          fi
          echo "All critical guest programs present."

      - name: Download prefixPack.txz (arm64ec, version-agnostic)
        run: |
          wget https://github.com/GameNative/bionic-prefix-files/raw/main/prefixPack-arm64ec.txz \
            -O $GITHUB_WORKSPACE/prefixPack.txz
          ls -lh $GITHUB_WORKSPACE/prefixPack.txz

      - name: Generate profile.json
        run: |
          cat > $GITHUB_WORKSPACE/profile.json << 'EOF'
          {
            "type": "Proton",
            "versionName": "9.0-arm64ec",
            "versionCode": 0,
            "description": "Proton 9.0 arm64ec (bionic) - FEX unixlib",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.txz"
            }
          }
          EOF
          cat $GITHUB_WORKSPACE/profile.json

      - name: Package Proton 9 arm64ec .wcp
        run: |
          OUTPUT_DIR="$HOME/compiled-files-aarch64"
          cd "$OUTPUT_DIR"
          cp $GITHUB_WORKSPACE/prefixPack.txz .
          cp $GITHUB_WORKSPACE/profile.json .
          # Outer container is xz (tar cJf); inner prefixPack.txz is already XZ.
          tar cJf proton-9.0-arm64ec.wcp bin lib share prefixPack.txz profile.json
          mv proton-9.0-arm64ec.wcp $GITHUB_WORKSPACE/
          ls -lh $GITHUB_WORKSPACE/proton-9.0-arm64ec.wcp

      - name: Upload Proton 9 arm64ec .wcp artifact
        uses: actions/upload-artifact@v4
        with:
          name: proton-9.0-arm64ec
          path: proton-9.0-arm64ec.wcp
          retention-days: 30
