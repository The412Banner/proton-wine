name: Proton 10.0-4 (bionic layer)
run-name: "Proton 10.0-4 — ${{ github.ref_name }} (${{ github.event_name }})"

# This file is named per layer on purpose: GitHub labels a run with the workflow name
# from the DEFAULT branch's copy of the same path, so a shared build-proton.yml made
# every layer's run read "11.0-1". A distinct path per branch shows the real name.
on:
  push:
    branches: [ main, master, proton_10.0, 'staging/proton_10.0/**' ]
  pull_request:
    branches: [ main, master, proton_10.0 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [aarch64]
        api_level: [28]
      fail-fast: false
    
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h
      
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up build environment
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            curl \
            unzip \
            flex \
            bison \
            gettext \
            autoconf \
            automake \
            libtool \
            pkg-config \
            mingw-w64 \
            gcc-multilib \
            g++-multilib \
            libwayland-bin \
            libfreetype6-dev \
            libfreetype6-dev:i386 \
            libpng-dev \
            libpng-dev:i386 \
            zlib1g-dev \
            zlib1g-dev:i386
      
      - name: Download and extract termuxfs for ${{ matrix.arch }}
        run: |
          mkdir -p $HOME/termuxfs/${{ matrix.arch }}
          cd $HOME/termuxfs/${{ matrix.arch }}
          wget https://github.com/GameNative/termux-on-gha/releases/download/build-20260218/termuxfs-${{ matrix.arch }}.tar
          tar -xf termuxfs-${{ matrix.arch }}.tar
          ls -la $HOME/termuxfs/${{ matrix.arch }}/
      
      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ~/Android/Sdk/ndk/27.3.13750724
          key: android-ndk-r27d
      
      - name: Set up Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/Android/Sdk/ndk
          cd $HOME/Android/Sdk/ndk
          wget https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip
          mv android-ndk-r27d 27.3.13750724
      
      - name: Cache LLVM MinGW toolchain
        id: cache-llvm-mingw
        uses: actions/cache@v4
        with:
          path: ~/toolchains/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64
          key: bylaws-llvm-mingw-20250920
      
      - name: Set up LLVM MinGW toolchain
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          wget https://github.com/bylaws/llvm-mingw/releases/download/20250920/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar -xf llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz
      
      - name: Run autogen.sh for ${{ matrix.arch }}
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            bash autogen.sh
          else
            bash autogen.sh --aarch64
          fi
      
      - name: Cache wine-tools
        id: cache-wine-tools
        uses: actions/cache@v4
        with:
          path: wine-tools
          key: wine-tools-${{ hashFiles('configure.ac', 'configure') }}

      # ccache — caches compiled objects across runs (per-SDK, per-arch, rolling restore-keys). Exact key
      # (per-commit) = full warm restore on a re-run of the same commit; restore-keys pull the newest prior
      # cache so an unchanged-source rebuild is near-instant. ccache self-validates staleness.
      - name: Cache ccache (${{ matrix.arch }})
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-p10-sdk${{ matrix.api_level }}-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-p10-sdk${{ matrix.api_level }}-${{ matrix.arch }}-

      - name: Build wine-tools (step 0)
        if: steps.cache-wine-tools.outputs.cache-hit != 'true'
        run: |
          bash build-scripts/build-step0.sh
      
      - name: Build sysvshm library for ${{ matrix.arch }}
        if: matrix.arch == 'aarch64'
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            bash build-scripts/build-step-x86_64.sh --build-sysvshm
          else
            bash build-scripts/build-step-arm64ec.sh --build-sysvshm
          fi
      
      - name: Configure build for ${{ matrix.arch }} (sdk${{ matrix.api_level }})
        run: |
          PAGES_FLAG="--enable-16kb-pages"
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            bash build-scripts/build-step-x86_64.sh $PAGES_FLAG --configure
          else
            bash build-scripts/build-step-arm64ec.sh $PAGES_FLAG --configure
          fi
      
      - name: Build Proton for ${{ matrix.arch }} (sdk${{ matrix.api_level }})
        run: |
          PAGES_FLAG="--enable-16kb-pages"
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            bash build-scripts/build-step-x86_64.sh $PAGES_FLAG --build
          else
            bash build-scripts/build-step-arm64ec.sh $PAGES_FLAG --build
          fi

      - name: ccache stats (${{ matrix.arch }})
        if: always()
        run: ccache -s || true

      - name: Install Proton for ${{ matrix.arch }} (sdk${{ matrix.api_level }})
        run: |
          PAGES_FLAG="--enable-16kb-pages"
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            bash build-scripts/build-step-x86_64.sh $PAGES_FLAG --install
          else
            bash build-scripts/build-step-arm64ec.sh $PAGES_FLAG --install
          fi
      
      # Binary verification of the installed tree BEFORE packaging: refuses a layer that
      # compiled fine but lost a feature (patch dropped, #ifdef'd out, wrong API level,
      # wrong page alignment, skeleton tree from a failed make). See verify-layer.py.
      - name: Verify layer binaries for ${{ matrix.arch }} (sdk${{ matrix.api_level }})
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            OUTPUT_DIR="$HOME/compiled-files-x86_64"
          else
            OUTPUT_DIR="$HOME/compiled-files-aarch64"
          fi
          # Every leg compiles against the android28 NDK target (true sdk28); the api_level 35
          # leg only adds 16 KB linker alignment (mirrors PAGES_FLAG in the build-step scripts).
          PAGES=4k; API=28
          { [ "${{ matrix.arch }}" = "aarch64" ] || [ "${{ matrix.api_level }}" = "35" ]; } && PAGES=16k
          GE=""; [ -d android/ge-patches/game-fixes ] && GE="--ge"
          python3 build-scripts/verify-layer.py "$OUTPUT_DIR" --arch ${{ matrix.arch }} --api $API --pages $PAGES $GE

      - name: Download prefixPack.txz for ${{ matrix.arch }}
        run: |
          # Pinned to GameNative/bionic-prefix-files @ 6286ac45 (2026-05-07, the files every
          # shipped layer was built with) and sha256-checked: a push to their `main` must never
          # change what our layer ships, and a truncated download must never be packaged.
          PIN=6286ac456e4a8376e053ce1ce4f565bd37cc4af4
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            NAME=prefixPack-x86_64.txz
            SHA=3ecd15f0f3af5e657c590ce499d9e6a061d5b19018be26549f27e64232fa6065
          else
            NAME=prefixPack-arm64ec.txz
            SHA=f9288d264f1def18b9a1a95c4132ddef004937ca265af5d2647e63b218e28d01
          fi
          wget --tries=5 --retry-connrefused --waitretry=10 "https://raw.githubusercontent.com/GameNative/bionic-prefix-files/$PIN/$NAME" -O $GITHUB_WORKSPACE/prefixPack.txz
          echo "$SHA  $GITHUB_WORKSPACE/prefixPack.txz" | sha256sum -c -
      
      - name: Register the layer's Windows Runtime classes in the prefix pack
        run: |
          # The pinned packs predate the WinRT classes this Wine adds (PropertySet, Storage.Streams,
          # DispatcherQueueController, MediaPlayer, ...); wineboot's first-launch update writes them
          # to Wow6432Node only on arm64ec, so 64-bit games could not activate them (Xbox sign-in).
          # Read the class names from this build's own DLLs and register them in both views. Wine 10
          # has no PropertySet (not backported), so the check uses Storage.Streams.Buffer, which the
          # pinned pack also lacks.
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            OUTPUT_DIR="$HOME/compiled-files-x86_64"; PE64=x86_64-windows
          else
            OUTPUT_DIR="$HOME/compiled-files-aarch64"; PE64=aarch64-windows
          fi
          python3 android/prefixpack-winrt-registry.py $GITHUB_WORKSPACE/prefixPack.txz \
            "$OUTPUT_DIR/lib/wine/$PE64" "$OUTPUT_DIR/lib/wine/i386-windows" prefixPack-winrt.txz
          for k in '[Software\\Microsoft\\WindowsRuntime\\ActivatableClassId\\Windows.Storage.Streams.Buffer]' \
                   '[Software\\Wow6432Node\\Microsoft\\WindowsRuntime\\ActivatableClassId\\Windows.Storage.Streams.Buffer]'; do
            tar -xJOf prefixPack-winrt.txz .wine/system.reg | grep -qF "$k" || { echo "FATAL: $k missing from the patched pack"; exit 1; }
          done
          mv prefixPack-winrt.txz $GITHUB_WORKSPACE/prefixPack.txz

      - name: Generate profile.json files
        run: |
          # Only the arm64ec leg carries winewayland, so only it may say so.
          WL_DESC=""
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            ARCH_NAME="x86_64"
          else
            ARCH_NAME="arm64ec"
            WL_DESC=". Wayland + HDR10 added."
          fi
          
          # Generate Proton profile.json
          cat > $GITHUB_WORKSPACE/profile.json << EOF
          {
            "type": "Proton",
            "versionName": "10.0-4-${ARCH_NAME}",
            "versionCode": 16,
            "description": "Proton 10.0-4 ${ARCH_NAME} - Windows compatibility layer with improved gaming support + DirectAudio v1.3.2 (opt-in: registry Audio=directaudio; pulse/alsa stay default) + Android fixes (noexec/force_anon SD-card boot, drive-root copy guard, C.UTF-8 locale)${WL_DESC} v10: Media Foundation cutscene fixes (WMV/WMA). v15: GameNative fixes (virtual-desktop mode list, high fixed allocations, GetNativeSystemInfo AMD64, crypt32 EKU, emulator cpu-area release) + WinRT classes registered in both prefix views. v16: service-manager crash fix (sechost/advapi32 import rpcrt4 directly; GOG Galaxy games, EA app).",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.txz"
            }
          }
          EOF
          
          # Generate Wine profile.json for Ludashi
          cat > $GITHUB_WORKSPACE/profile-wine.json << EOF
          {
            "type": "Wine",
            "versionName": "10.0-4-${ARCH_NAME}",
            "versionCode": 16,
            "description": "Proton 10.0-4 ${ARCH_NAME} - Windows compatibility layer with improved gaming support + DirectAudio v1.3.2 (opt-in: registry Audio=directaudio; pulse/alsa stay default)${WL_DESC} v10: Media Foundation cutscene fixes (WMV/WMA). v15: GameNative fixes (virtual-desktop mode list, high fixed allocations, GetNativeSystemInfo AMD64, crypt32 EKU, emulator cpu-area release) + WinRT classes registered in both prefix views. v16: service-manager crash fix (sechost/advapi32 import rpcrt4 directly; GOG Galaxy games, EA app).",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.txz"
            }
          }
          EOF
      
      - name: Package build artifacts
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            OUTPUT_DIR="$HOME/compiled-files-x86_64"
            ARCH_NAME="x86_64"
          else
            OUTPUT_DIR="$HOME/compiled-files-aarch64"
            ARCH_NAME="arm64ec"
          fi
          
          cd $OUTPUT_DIR
          
          # The Wayland driver on its own, laid out like the installed Proton directory.
          for f in lib/wine/aarch64-unix/winewayland.so lib/wine/aarch64-windows/winewayland.drv \
                   lib/wine/i386-windows/winewayland.drv; do
            if [ -f "$f" ]; then mkdir -p "$GITHUB_WORKSPACE/winewayland-files/$(dirname "$f")"; cp "$f" "$GITHUB_WORKSPACE/winewayland-files/$f"; fi
          done
          
          # Create Proton WCP - zstd (tar.zst) for fast in-app install. The app's ContentsManager
          # tries XZ then falls back to ZSTD, so a zstd .wcp installs with no app change and decompresses
          # far faster than xz. -T0 = all cores, -19 = high ratio (small download).
          cp $GITHUB_WORKSPACE/prefixPack.txz .
          cp $GITHUB_WORKSPACE/profile.json .
          tar -I 'zstd -T0 -19' -cf proton-10.0-4-$ARCH_NAME.wcp bin lib share prefixPack.txz profile.json
          mv proton-10.0-4-$ARCH_NAME.wcp $GITHUB_WORKSPACE/
          
          # Create Wine WCP for CMOD & Ludashi - wcp.xz format
          cp $GITHUB_WORKSPACE/profile-wine.json profile.json
          tar cJf proton-wine-10.0-4-$ARCH_NAME.wcp.xz bin lib share prefixPack.txz profile.json
          mv proton-wine-10.0-4-$ARCH_NAME.wcp.xz $GITHUB_WORKSPACE/
      
      # The packaged archive must carry exactly what the app's ContentsManager expects.
      - name: Verify wcp archives
        run: |
          cd $GITHUB_WORKSPACE
          UNIX="${{ matrix.arch }}-unix"
          for WCP in *.wcp; do
            echo "== $WCP ($(stat -c %s "$WCP") bytes)"
            tar -I zstd -tf "$WCP" > wcp.lst
            for e in profile.json prefixPack.txz bin/wine "lib/wine/$UNIX/ntdll.so" "lib/wine/$UNIX/win32u.so" share/wine/wine.inf; do
              grep -qx -- "$e" wcp.lst || { echo "FATAL: $e missing from $WCP"; exit 1; }
            done
            tar -I zstd -xf "$WCP" -O profile.json > wcp-profile.json
            cmp wcp-profile.json profile.json || { echo "FATAL: profile.json inside $WCP differs from the generated one"; exit 1; }
            python3 -c 'import json,sys; p=json.load(open("wcp-profile.json")); print("   type=%s versionName=%s versionCode=%s" % (p["type"], p["versionName"], p["versionCode"]))'
            echo "   $(wc -l < wcp.lst) entries; ok"
          done
          for WCPXZ in *.wcp.xz; do
            echo "== $WCPXZ ($(stat -c %s "$WCPXZ") bytes)"
            tar -tJf "$WCPXZ" | grep -qx profile.json || { echo "FATAL: profile.json missing from $WCPXZ"; exit 1; }
            echo "   ok"
          done

      - name: Upload build artifacts
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            ARCH_NAME="x86_64"
          else
            ARCH_NAME="arm64ec"
          fi
          echo "ARCH_NAME=$ARCH_NAME" >> $GITHUB_ENV
      
      - name: Upload Proton build artifacts for ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: proton-${{ env.ARCH_NAME }}-sdk${{ matrix.api_level }}
          path: proton-10.0-4-${{ env.ARCH_NAME }}.wcp
          retention-days: 30
      
      # Just the Wayland driver, for replacing it in an installed copy of this same build.
      - name: Upload Wayland driver for ${{ matrix.arch }}
        if: matrix.arch == 'aarch64'
        uses: actions/upload-artifact@v4
        with:
          name: winewayland-${{ env.ARCH_NAME }}
          path: winewayland-files
          if-no-files-found: error
          retention-days: 30
      
      - name: Upload Wine build artifacts for ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: proton-wine-${{ env.ARCH_NAME }}-sdk${{ matrix.api_level }}
          path: proton-wine-10.0-4-${{ env.ARCH_NAME }}.wcp.xz
          retention-days: 30
  
  release:
    needs: build
    runs-on: ubuntu-24.04
    # Hard-disabled: a push to proton_10.0 must NOT auto-cut a per-sdk release (wrong tag/body). Releases
    # are produced only by an explicit `gh release create`. Build artifacts are still uploaded as before.
    if: false

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name "*.wcp" -exec cp {} release/ \;
          find artifacts -name "*.wcp.xz" -exec cp {} release/ \;
          ls -lah release/
      
      - name: Generate date-based tag
        id: generate_tag
        run: |
          DATE=$(date +%Y%m%d)
          TAG_NAME="build-p10-${DATE}-sdk28"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Generated tag: ${TAG_NAME}"
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.generate_tag.outputs.tag_name }}
          name: Proton Wine 10.0-4 (SDK 28, ${{ steps.generate_tag.outputs.tag_name }})
          files: release/*
          draft: false
          prerelease: false
          body: |
            # Caution: This version is provided for testing purposes only. It may lead to game instability or crashes. Use at your own risk.
            
            ## Proton Wine Build based on Valve [Wine](https://github.com/ValveSoftware/wine/tree/proton_10.0)
            
            ### Proton Version: 10.0-4
            
            Built from commit: ${{ github.sha }}
            
            ### Architectures
            - x86_64 (Intel/AMD 64-bit)
            - arm64ec (ARM64EC)
            
            ### WCP Files
            **Proton Type:**
            - `proton-10.0-4-x86_64.wcp` - For GameNative
            - `proton-10.0-4-arm64ec.wcp` - For GameNative
            
            **Wine Type:**
            - `proton-wine-10.0-4-x86_64.wcp.xz` - For Winlator for CMOD & Ludashi
            - `proton-wine-10.0-4-arm64ec.wcp.xz` - For Winlator for CMOD & Ludashi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
