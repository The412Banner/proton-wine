name: Publish bionic layers bundle

# Manual-only. Pulls the already-built arm64ec .wcp from the 10 build runs
# (5 layers x sdk28/sdk35) entirely on the GitHub runner, renames each to a
# unique name, attaches all 10 to the existing draft release, and publishes it.
# Nothing is rebuilt and no artifact leaves the runner.

on:
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      TAG: build-bionic-layers-20260817-arihany
    steps:
      - name: Download 10 arm64ec artifacts and rename
        run: |
          set -euo pipefail
          # run-id -> unique release asset name (proton-arm64ec artifact per run)
          ids=(32024170376 32024173270 32025505346 32025507283 32025623928 32025627702 32028190731 32028193030 32030797485 32030799661)
          names=(GE-proton-11.0-5-arm64ec-sdk28.wcp GE-proton-11.0-5-arm64ec-sdk35.wcp \
                 GE-proton-11.0-3-arm64ec-sdk28.wcp GE-proton-11.0-3-arm64ec-sdk35.wcp \
                 proton-11.0-1-arm64ec-sdk28.wcp proton-11.0-1-arm64ec-sdk35.wcp \
                 proton-10.0-4-arm64ec-sdk28.wcp proton-10.0-4-arm64ec-sdk35.wcp \
                 GE-proton-10.0-34-arm64ec-sdk28.wcp GE-proton-10.0-34-arm64ec-sdk35.wcp)
          mkdir -p release
          for i in "${!ids[@]}"; do
            id="${ids[$i]}"; name="${names[$i]}"
            echo "== run $id -> $name =="
            gh run download "$id" -R "$REPO" -n proton-arm64ec -D "dl/$id"
            f=$(ls "dl/$id"/*.wcp)
            cp "$f" "release/$name"
          done
          echo "Assets to publish:"; ls -lah release/
          test "$(ls -1 release/*.wcp | wc -l)" -eq 10

      - name: Attach to existing draft and publish
        run: |
          set -euo pipefail
          gh release upload "$TAG" release/*.wcp -R "$REPO" --clobber
          n=$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets | length')
          echo "attached assets = $n"
          test "$n" -eq 10
          gh release edit "$TAG" -R "$REPO" --draft=false
          echo "== final release state =="
          gh release view "$TAG" -R "$REPO" --json isDraft,url,tagName,assets \
            --jq '{draft:.isDraft, url:.url, tag:.tagName, count:(.assets|length), names:[.assets[].name]}'
